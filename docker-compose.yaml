version: '3.7'
services:
  app:
    container_name: go-api
    build: .
    ports:
      - "9000:9000"
    networks:
      - go-api-net
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:latest
    container_name: go-api-db
    ports:
      - "5432:5432"
    networks:
      - go-api-net
    restart: always
    environment:
      POSTGRES_USER: go-api
      POSTGRES_PASSWORD: go-api
      POSTGRES_DB: go-api
    healthcheck:
      test: pg_isready -U go-api
    volumes:
      - postgres:/var/lib/postgresql/data
networks:
  go-api-net: {}
volumes:
  postgres: